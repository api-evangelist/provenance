name: Provenance
description: >-
  Provenance Blockchain is a public, proof-of-stake blockchain purpose-built for
  financial services and the tokenization of real-world assets. Built on the Cosmos
  SDK with CometBFT consensus, it exposes its functionality through first-party modules
  including marker (token/marker issuance), metadata (asset registry and the p8e contract
  execution environment), exchange (on-chain order book), ledger, name, attribute, hold,
  trigger, and msgfees/flatfees. Applications integrate over the public Cosmos REST
  (LCD / gRPC-gateway) API at api.provenance.io, gRPC, and Tendermint RPC at
  rpc.provenance.io, and via first-party SDKs (Go, Kotlin gRPC client, Rust/CosmWasm
  provwasm bindings, and JavaScript wallet libraries). HASH is the native staking and
  gas token. The chain, protobuf data model, and SDKs are open source under the
  provenance-io GitHub organization.
